<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relatorios - Controle de Maquinas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar" id="appTopbar"></header>
    <div class="app-body">
      <aside class="app-sidebar" id="appSidebar"></aside>
      <main class="app-main" id="appMain">

        <div class="mb-3">
          <h1 class="h4 mb-1">Relatorios</h1>
          <p class="text-muted small mb-0">Somente coletas confirmadas entram nos totais.</p>
        </div>

        <div class="card mb-3">
          <div class="card-body p-3">
            <div class="row g-3 align-items-end">

              <!-- Cliente: escolhido por clique, um de cada vez. -->
              <div class="col-12 col-lg-6" data-filter-owner>
                <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                  <label class="form-label mb-0" id="ownerPickLabel">Cliente</label>
                  <input type="search" class="form-control form-control-sm ms-auto" id="ownerSearch"
                         placeholder="Buscar cliente" aria-label="Buscar cliente"
                         style="max-width: 220px;">
                </div>
                <div class="pick-list" id="ownerPick" role="group" aria-labelledby="ownerPickLabel">
                  <span class="pick-empty">Carregando...</span>
                </div>
              </div>

              <!-- Maquinas: varias por clique. Sem selecao = todas do recorte. -->
              <div class="col-12 col-lg-6" data-filter-machines>
                <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                  <label class="form-label mb-0" id="machinePickLabel">Maquinas</label>
                  <span class="badge text-bg-light" id="machineCount">Todas</span>
                  <div class="btn-group btn-group-sm ms-auto">
                    <button type="button" class="btn btn-outline-secondary" id="btnPickAll">Selecionar todas</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnPickNone">Limpar</button>
                  </div>
                </div>
                <div class="pick-list" id="machinePick" role="group" aria-labelledby="machinePickLabel">
                  <span class="pick-empty">Carregando...</span>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="periodSelect">Periodo</label>
                <select class="form-select" id="periodSelect">
                  <option value="month" selected>Este mes</option>
                  <option value="today">Hoje</option>
                  <option value="week">Esta semana</option>
                  <option value="last_month">Mes anterior</option>
                  <option value="all">Todo o periodo</option>
                  <option value="custom">Personalizado</option>
                </select>
              </div>
              <div class="col-6 col-md-4 d-none" data-custom-range>
                <label class="form-label" for="startDate">Data inicial</label>
                <input type="date" class="form-control" id="startDate">
              </div>
              <div class="col-6 col-md-4 d-none" data-custom-range>
                <label class="form-label" for="endDate">Data final</label>
                <input type="date" class="form-control" id="endDate">
              </div>
              <div class="col-12 col-md-8 d-flex gap-2">
                <button class="btn btn-primary btn-touch flex-fill" id="btnGenerate">Gerar relatorio</button>
                <button class="btn btn-outline-primary btn-touch flex-fill" id="btnPdf" disabled>
                  <span aria-hidden="true">&#128196;</span> PDF
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="card mb-3" id="reportTotals"></div>

        <div class="card">
          <div class="card-body p-2 p-md-3">
            <div id="reportContent">
              <div class="state-block">
                <div class="state-icon">&#128200;</div>
                <p class="mb-0">Escolha os filtros e clique em "Gerar relatorio".</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/reports.js"></script>
</body>
</html>
