<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coletas - Controle de Maquinas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar" id="appTopbar"></header>
    <div class="app-body">
      <aside class="app-sidebar" id="appSidebar"></aside>
      <main class="app-main" id="appMain">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h1 class="h4 mb-0">Coletas</h1>
          <a href="/collection-new.html" class="btn btn-primary btn-touch">
            <span aria-hidden="true">&#10133;</span> Nova coleta
          </a>
        </div>

        <div class="card mb-3">
          <div class="card-body p-3">
            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-4">
                <label class="form-label" for="ownerFilter">Proprietario</label>
                <select class="form-select" id="ownerFilter"><option value="">Todos</option></select>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="machineFilter">Maquina</label>
                <select class="form-select" id="machineFilter"><option value="">Todas</option></select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label" for="statusFilter">Status</label>
                <select class="form-select" id="statusFilter">
                  <option value="">Todos</option>
                  <option value="confirmed">Confirmada</option>
                  <option value="cancelled">Cancelada</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label" for="periodSelect">Periodo</label>
                <select class="form-select" id="periodSelect">
                  <option value="all" selected>Todo o periodo</option>
                  <option value="today">Hoje</option>
                  <option value="week">Esta semana</option>
                  <option value="month">Este mes</option>
                  <option value="last_month">Mes anterior</option>
                  <option value="custom">Personalizado</option>
                </select>
              </div>
              <div class="col-6 col-md-3 d-none" data-custom-range>
                <label class="form-label" for="startDate">De</label>
                <input type="date" class="form-control" id="startDate">
              </div>
              <div class="col-6 col-md-3 d-none" data-custom-range>
                <label class="form-label" for="endDate">Ate</label>
                <input type="date" class="form-control" id="endDate">
              </div>
              <div class="col-12 col-md-3 d-none" data-custom-range>
                <button class="btn btn-outline-primary w-100 btn-touch" id="btnApplyPeriod">Aplicar</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card mb-3" id="totalsCard"></div>

        <div class="card">
          <div class="card-body p-2 p-md-3">
            <div id="collectionsList"></div>
            <div id="collectionsPagination" class="mt-3"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/collections.js"></script>
</body>
</html>
