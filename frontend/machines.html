<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maquinas - Controle de Maquinas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar" id="appTopbar"></header>
    <div class="app-body">
      <aside class="app-sidebar" id="appSidebar"></aside>
      <main class="app-main" id="appMain">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h1 class="h4 mb-0">Maquinas</h1>
          <button class="btn btn-primary btn-touch" id="btnNewMachine">
            <span aria-hidden="true">&#10133;</span> Nova maquina
          </button>
        </div>

        <div class="card mb-3">
          <div class="card-body p-3">
            <div class="row g-2">
              <div class="col-12 col-md-5">
                <label class="form-label" for="searchInput">Pesquisar</label>
                <input type="search" class="form-control" id="searchInput"
                       placeholder="Numero, nome ou proprietario" autocomplete="off">
              </div>
              <div class="col-12 col-sm-6 col-md-4">
                <label class="form-label" for="ownerFilter">Proprietario</label>
                <select class="form-select" id="ownerFilter"><option value="">Todos</option></select>
              </div>
              <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label" for="statusFilter">Status</label>
                <select class="form-select" id="statusFilter">
                  <option value="">Todos</option>
                  <option value="active">Ativa</option>
                  <option value="maintenance">Manutencao</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body p-2 p-md-3">
            <div id="machinesList"></div>
            <div id="machinesPagination" class="mt-3"></div>
          </div>
        </div>

        <div class="modal fade" id="machineModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <form class="modal-content" id="machineForm" novalidate>
              <div class="modal-header">
                <h5 class="modal-title" id="machineModalTitle">Nova maquina</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" name="id">
                <div class="row g-3">
                  <div class="col-6 col-md-4">
                    <label class="form-label" for="machineNumber">Numero <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="machineNumber" name="number" required maxlength="20" placeholder="001">
                    <div class="form-text">Unico no sistema.</div>
                    <div class="invalid-feedback" data-error-for="number"></div>
                  </div>
                  <div class="col-12 col-md-8">
                    <label class="form-label" for="machineName">Nome <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="machineName" name="name" required maxlength="150" placeholder="Maquina Principal">
                    <div class="invalid-feedback" data-error-for="name"></div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="machineOwner">Proprietario <span class="text-danger">*</span></label>
                    <select class="form-select" id="machineOwner" name="owner_id" required></select>
                    <div class="invalid-feedback" data-error-for="owner_id"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="machineModel">Modelo</label>
                    <input type="text" class="form-control" id="machineModel" name="model" maxlength="120">
                    <div class="invalid-feedback" data-error-for="model"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="machineManufacturer">Fabricante</label>
                    <input type="text" class="form-control" id="machineManufacturer" name="manufacturer" maxlength="120">
                    <div class="invalid-feedback" data-error-for="manufacturer"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="machineSerial">Numero de serie</label>
                    <input type="text" class="form-control" id="machineSerial" name="serial_number" maxlength="120">
                    <div class="invalid-feedback" data-error-for="serial_number"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="machineInstall">Data de instalacao</label>
                    <input type="date" class="form-control" id="machineInstall" name="installation_date">
                    <div class="invalid-feedback" data-error-for="installation_date"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="machineStatus">Status</label>
                    <select class="form-select" id="machineStatus" name="status">
                      <option value="active">Ativa</option>
                      <option value="maintenance">Manutencao</option>
                    </select>
                    <div class="invalid-feedback" data-error-for="status"></div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="machineNotes">Observacoes</label>
                    <textarea class="form-control" id="machineNotes" name="notes" rows="3" maxlength="5000"></textarea>
                    <div class="invalid-feedback" data-error-for="notes"></div>
                  </div>
                </div>
              </div>
              <div class="modal-footer flex-column flex-sm-row gap-2">
                <button type="button" class="btn btn-outline-secondary btn-touch w-100 w-sm-auto m-0" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary btn-touch w-100 w-sm-auto m-0" id="btnSaveMachine">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/machines.js"></script>
</body>
</html>
