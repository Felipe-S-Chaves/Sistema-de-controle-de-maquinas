<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Definir nova senha - Controle de Maquinas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-light">
  <main class="container-fluid px-3">
    <div class="row justify-content-center align-items-center" style="min-height:100vh">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4 py-4">

        <div class="text-center mb-4">
          <div class="d-inline-grid mb-2" style="width:56px;height:56px;place-items:center;border-radius:14px;background:var(--brand);color:#fff;font-size:1.5rem">&#128274;</div>
          <h1 class="h4 mb-1">Defina sua senha</h1>
          <p class="text-muted small mb-0" id="subtitulo">Escolha uma senha so sua antes de continuar.</p>
        </div>

        <div class="card">
          <div class="card-body p-3 p-sm-4">

            <div class="alert alert-warning small d-none" id="avisoObrigatorio">
              Sua conta foi criada com uma <strong>senha temporaria</strong>.
              Ate voce definir uma senha propria, o sistema fica indisponivel.
            </div>

            <div id="alerta" class="alert d-none" role="alert"></div>

            <form id="formSenha" novalidate>
              <div class="mb-3">
                <label class="form-label" for="senhaAtual">Senha atual</label>
                <input type="password" class="form-control" id="senhaAtual" name="currentPassword"
                       autocomplete="current-password" required>
                <div class="form-text" id="dicaAtual">A senha temporaria que voce recebeu.</div>
                <div class="invalid-feedback" data-error-for="currentPassword"></div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="senhaNova">Nova senha</label>
                <input type="password" class="form-control" id="senhaNova" name="newPassword"
                       autocomplete="new-password" minlength="8" required>
                <div class="form-text">Minimo de 8 caracteres.</div>
                <div class="invalid-feedback" data-error-for="newPassword"></div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="senhaConfirma">Repita a nova senha</label>
                <input type="password" class="form-control" id="senhaConfirma" name="confirm"
                       autocomplete="new-password" minlength="8" required>
                <div class="invalid-feedback" data-error-for="confirm"></div>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 mb-2" id="btnSalvar">
                Salvar e entrar
              </button>
              <button type="button" class="btn btn-link w-100" id="btnSair">Sair</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/change-password.js"></script>
</body>
</html>
