<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proprietarios - Controle de Maquinas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar" id="appTopbar"></header>
    <div class="app-body">
      <aside class="app-sidebar" id="appSidebar"></aside>
      <main class="app-main" id="appMain">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h1 class="h4 mb-0">Proprietarios</h1>
          <button class="btn btn-primary btn-touch" id="btnNewOwner">
            <span aria-hidden="true">&#10133;</span> Novo proprietario
          </button>
        </div>

        <div class="card mb-3">
          <div class="card-body p-3">
            <div class="row g-2">
              <div class="col-12 col-md-7">
                <label class="form-label" for="searchInput">Pesquisar</label>
                <input type="search" class="form-control" id="searchInput"
                       placeholder="Nome, CPF/CNPJ, e-mail ou telefone" autocomplete="off">
              </div>
              <div class="col-12 col-md-5">
                <label class="form-label" for="statusFilter">Status</label>
                <select class="form-select" id="statusFilter">
                  <option value="">Todos</option>
                  <option value="active">Ativos</option>
                  <option value="inactive">Inativos</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body p-2 p-md-3">
            <div id="ownersList"></div>
            <div id="ownersPagination" class="mt-3"></div>
          </div>
        </div>

        <!-- Modal de cadastro/edicao -->
        <div class="modal fade" id="ownerModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <form class="modal-content" id="ownerForm" novalidate>
              <div class="modal-header">
                <h5 class="modal-title" id="ownerModalTitle">Novo proprietario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" name="id">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label" for="ownerName">Nome completo / Razao social <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="ownerName" name="name" required maxlength="180">
                    <div class="invalid-feedback" data-error-for="name"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="ownerDocument">CPF / CNPJ</label>
                    <input type="text" class="form-control" id="ownerDocument" name="document"
                           inputmode="numeric" maxlength="18" placeholder="000.000.000-00">
                    <div class="invalid-feedback" data-error-for="document"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="ownerEmail">E-mail</label>
                    <input type="email" class="form-control" id="ownerEmail" name="email" maxlength="190">
                    <div class="invalid-feedback" data-error-for="email"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="ownerPhone">Telefone</label>
                    <input type="tel" class="form-control" id="ownerPhone" name="phone" inputmode="tel" maxlength="20">
                    <div class="invalid-feedback" data-error-for="phone"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="ownerWhatsapp">WhatsApp</label>
                    <input type="tel" class="form-control" id="ownerWhatsapp" name="whatsapp" inputmode="tel" maxlength="20">
                    <div class="invalid-feedback" data-error-for="whatsapp"></div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="ownerAddress">Endereco</label>
                    <input type="text" class="form-control" id="ownerAddress" name="address" maxlength="255">
                    <div class="invalid-feedback" data-error-for="address"></div>
                  </div>
                  <div class="col-12 col-md-5">
                    <label class="form-label" for="ownerCity">Cidade</label>
                    <input type="text" class="form-control" id="ownerCity" name="city" maxlength="120">
                    <div class="invalid-feedback" data-error-for="city"></div>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label" for="ownerState">UF</label>
                    <input type="text" class="form-control text-uppercase" id="ownerState" name="state" maxlength="2">
                    <div class="invalid-feedback" data-error-for="state"></div>
                  </div>
                  <div class="col-6 col-md-4">
                    <label class="form-label" for="ownerZip">CEP</label>
                    <input type="text" class="form-control" id="ownerZip" name="zip_code" inputmode="numeric" maxlength="9">
                    <div class="invalid-feedback" data-error-for="zip_code"></div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="ownerNotes">Observacoes</label>
                    <textarea class="form-control" id="ownerNotes" name="notes" rows="3" maxlength="5000"></textarea>
                    <div class="invalid-feedback" data-error-for="notes"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="ownerStatus">Status</label>
                    <select class="form-select" id="ownerStatus" name="status">
                      <option value="active">Ativo</option>
                      <option value="inactive">Inativo</option>
                    </select>
                    <div class="invalid-feedback" data-error-for="status"></div>
                  </div>
                </div>
              </div>
              <div class="modal-footer flex-column flex-sm-row gap-2">
                <button type="button" class="btn btn-outline-secondary btn-touch w-100 w-sm-auto m-0" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary btn-touch w-100 w-sm-auto m-0" id="btnSaveOwner">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/owners.js"></script>
</body>
</html>
